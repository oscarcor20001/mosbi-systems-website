<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cyan to Electric Blue Brand Gradient -->
    <linearGradient id="mosbiMGrad" x1="30" y1="20" x2="170" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#0044ee" />
    </linearGradient>

    <!-- Inner Accent Shimmer -->
    <linearGradient id="mosbiShimmer" x1="170" y1="20" x2="30" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Minimalist Dual-Stroke Geometric M Monogram -->
  <path 
    d="M36 166 V66 C36 42 54 26 78 26 C90 26 97 32 100 38 C103 32 110 26 122 26 C146 26 164 42 164 66 V166 H138 V70 C138 55 128 46 116 46 C104 46 98 55 98 70 V122 H102 V70 C102 55 96 46 84 46 C72 46 62 55 62 70 V166 H36 Z" 
    fill="url(#mosbiMGrad)"
  />

  <!-- Clean Precision Central Apex Notch -->
  <path 
    d="M84 46 C96 46 100 55 100 70 V122 C100 55 104 46 116 46" 
    stroke="url(#mosbiShimmer)" 
    stroke-width="5" 
    stroke-linecap="round"
  />

  <!-- Optical Precision Dot -->
  <circle cx="100" cy="122" r="4.5" fill="#ffffff" filter="url(#subtleGlow)" />
</svg>
